name: Build
description: Builds Mime with proper caching.

outputs:
  cache-key:
    description: The key to save the build folder under.
    value: build-${{ steps.dependencies.outputs.id }}-${{ github.sha }}

runs:
  using: composite

  steps:
    - name: dependencies
      id: dependencies
      shell: bash
      run: |
        sudo apt-get update

        sudo apt-get install -y --no-install-recommends clang lld llvm cmake \
          ninja-build pkg-config libsdl3-dev libwayland-dev \
          libcurl4-openssl-dev libsystemd-dev

        echo "id=$(dpkg-query -W | sha256sum | cut -c 1-16)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache/restore@v4
      with:
        path: build
        key: build-${{ steps.dependencies.outputs.id }}-${{ github.sha }}
        restore-keys: build-${{ steps.dependencies.outputs.id }}-

    - name: build
      shell: bash
      run: |
        git -c core.quotepath=off ls-files -s > sources

        if [ -f build/.sources ]; then
          comm -12 <(sort build/.sources) <(sort sources) | cut -f2 | xargs -d '\n' touch -h -d 2000-01-01
        fi

        cmake -B build -G Ninja
        cmake --build build
        mv sources build/.sources
