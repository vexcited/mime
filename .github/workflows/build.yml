name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        uses: ./.github/actions/build
        id: build

      - name: Package
        uses: ./.github/actions/package
        id: package

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.tarball }}
          archive: false

      - name: Cache
        uses: actions/cache/save@v6
        with:
          path: build
          key: ${{ steps.build.outputs.cache-key }}
